name: check-token
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o r.json -w "%{http_code}" "https://graph.threads.net/v1.0/me?fields=id,username&access_token=$THREADS_TOKEN")
          echo "HTTP $code"
          python3 -c "import json;d=json.load(open('r.json'));print('username:', d.get('username') or d.get('error',{}).get('message'))"
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
